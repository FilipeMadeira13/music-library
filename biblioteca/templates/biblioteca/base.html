<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Biblioteca de álbuns{% endblock %}</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            color: #1f2937;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 44rem;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }

        h1 { line-height: 1.2; }
        a { color: #164e9d; }
        a:focus-visible {
            outline: 3px solid #164e9d;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
