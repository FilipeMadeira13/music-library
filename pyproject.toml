[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-library"
version = "0.1.0"
description = "Personal music library backed by MusicBrainz."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "accounts*", "musicbrainz*", "library*", "api*", "web*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # docstrings optional
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "CPY001",  # no per-file copyright headers in this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]
"manage.py" = ["INP001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/", "^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "tests/*",
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]
